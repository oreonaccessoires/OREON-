<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION Accessories</title>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #d4af37; /* Elegant Gold to match ORION logo */
            --accent-hover: #b59226;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
        }

        /* Header Layout */
        header {
            background-color: var(--primary-color);
            color: #fff;
            padding: 10px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 45px;
            display: block;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        section {
            padding: 60px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            color: var(--primary-color);
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--accent-color);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* Store Section */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #e2e8f0;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
            text-align: center;
        }

        .card-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* Contact Section */
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        footer {
            background: var(--primary-color);
            color: #94a3b8;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Header with ORION Logo -->
    <header>
        <div class="logo">
            <img src="https://raw.githubusercontent.com/oreonaccessoires/OREON-/main/803CDB18-8551-43D7-B862-30AA90CD5AC0.png" alt="ORION Accessories Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#store">Collection</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Products / Accessories Section -->
    <section id="store">
        <h2 class="section-title">Our Collection</h2>
        <div class="grid-container">
            <!-- Product 1 -->
            <div class="card">
                <img src="https://raw.githubusercontent.com/oreonaccessoires/OREON-/main/IMG_8059.jpeg" alt="Accessory 1">
                <div class="card-body">
                    <h3 class="card-title">ORION Item #8059</h3>
                    <button class="btn" onclick="addToCart('Item 8059')">Order Now</button>
                </div>
            </div>
            <!-- Product 2 -->
            <div class="card">
                <img src="https://raw.githubusercontent.com/oreonaccessoires/OREON-/main/IMG_8061.jpeg" alt="Accessory 2">
                <div class="card-body">
                    <h3 class="card-title">ORION Item #8061</h3>
                    <button class="btn" onclick="addToCart('Item 8061')">Order Now</button>
                </div>
            </div>
            <!-- Product 3 -->
            <div class="card">
                <img src="https://raw.githubusercontent.com/oreonaccessoires/OREON-/main/IMG_8062.jpeg" alt="Accessory 3">
                <div class="card-body">
                    <h3 class="card-title">ORION Item #8062</h3>
                    <button class="btn" onclick="addToCart('Item 8062')">Order Now</button>
                </div>
            </div>
            <!-- Product 4 -->
            <div class="card">
                <img src="https://raw.githubusercontent.com/oreonaccessoires/OREON-/main/IMG_8063.jpeg" alt="Accessory 4">
                <div class="card-body">
                    <h3 class="card-title">ORION Item #8063</h3>
                    <button class="btn" onclick="addToCart('Item 8063')">Order Now</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2 class="section-title">Contact Us</h2>
        <form class="contact-form" onsubmit="handleContact(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@domain.com" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="4" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 ORION Accessories. All Rights Reserved.</p>
    </footer>

    <script>
        function addToCart(itemName) {
            alert('Selected: ' + itemName);
        }

        function handleContact(event) {
            event.preventDefault();
            alert('Thank you for reaching out to ORION Accessories!');
            event.target.reset();
        }
    </script>
</body>
</html>
