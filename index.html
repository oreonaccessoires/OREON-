:root{
  --gold:#d4af37;

  --card:#151515;
  --text:#fff;
  --border:#333;

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

body.light{
  --bg:#fff;
  --card:#f5f5f5;
  --text:#111;
  --border:#ccc;
}

header{
  text-align:center;
  padding:35px 15px 25px;
  border-bottom:1px solid var(--gold);
}

.logo{
  font-size:48px;
  font-weight:700;
  letter-spacing:9px;
  color:var(--gold);
}

.subtitle{
  margin-top:8px;
  font-size:25px;
  letter-spacing:6px;
  color:#aaa;
}

.nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
  margin-top:35px;
}

.nav button,
.controls button,
select{
  border:1px solid var(--gold);
  background:transparent;
  color:var(--text);
  border-radius:30px;
  padding:14px 25px;
  font-size:17px;
  cursor:pointer;
}

.nav button.active,
.nav button:hover{
  background:var(--gold);
  color:#000;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-top:25px;
}

select{
  background:var(--bg);
}

.section{
  max-width:750px;
  margin:35px auto;
  padding:0 18px;
}

.section-title{
  text-align:center;
  color:var(--gold);
  font-size:38px;
  margin:25px 0 30px;
}

.products{
  display:flex;
  flex-direction:column;
  gap:28px;
}

.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:25px;
  padding:18px;
  overflow:hidden;
}

.main-image{
  width:100%;
  height:auto;
  max-height:650px;
  object-fit:contain;
  display:block;
  border-radius:18px;
  background:#222;
}

.thumbs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:12px 0 5px;
}

.thumbs img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  border:2px solid transparent;
  flex-shrink:0;
}

.thumbs img:hover{
  border-color:var(--gold);
}

.product h3{
  font-size:25px;
  margin:18px 0 12px;
}

.price{
  color:var(--gold);
  font-size:25px;
  font-weight:bold;
  margin-bottom:18px;
}

.whatsapp{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  background:var(--gold);
  color:#000;
  font-size:19px;
  font-weight:bold;
  padding:17px;
  border-radius:18px;
  transition:.2s;
}

.whatsapp:hover{
  transform:scale(1.02);
}

.hidden{
  display:none;
}

footer{
  text-align:center;
  padding:40px 15px;
  color:#888;
}

@media(max-width:600px){

  .logo{
    font-size:38px;
    letter-spacing:7px;

  .subtitle{

  }

  .section-title{

  }

  .product h3{

  }

</style>

/* =====================================================
   CREATE PRODUCTS
===================================================== */

function createProducts(list, containerId, type){

  const container = document.getElementById(containerId);

  list.forEach((product,index)=>{

    const card = document.createElement("div");

    card.className = "product";

    const mainId = `${type}-main-${index}`;

    let thumbnails = "";

    product.images.forEach((image)=>{

      thumbnails += `
        <img
          src="${encodeURI(image)}"
          onclick="changeImage('${mainId}', this.src)"
          alt="${product.model}"
          onerror="this.style.display='none'"
        >
      `;

    });


    let categoryText = "";

    if(product.category){

      categoryText = `
        <div style="color:#aaa;margin-bottom:10px;">
          ${product.category}
        </div>
      `;

    }


    let productName = "Glasses";

    if(type === "chain"){
      productName = "Chain";
    }

    if(type === "bracelet"){
      productName = "Women's Bracelet";
    }


    const message =
      `Hello ORION Accessories, I want ${productName} Model ${product.model} - ${product.price} DH`;


    const whatsappLink =
      `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;


    card.innerHTML = `

      <img
        id="${mainId}"
        class="main-image"
        src="${encodeURI(product.images[0])}"
        alt="ORION ${productName} Model ${product.model}"
        onerror="imageError(this)"
      >

      <div class="thumbs">
        ${thumbnails}
      </div>

      <h3>
        ORION ${productName} Model ${product.model}
      </h3>

      ${categoryText}

      <div class="price">
        ${product.price} DH
      </div>

      <a
        class="whatsapp"
        href="${whatsappLink}"
        target="_blank"
      >
        Commander WhatsApp
      </a>

    `;


    container.appendChild(card);

  });

}

/* =====================================================
   IMAGE
===================================================== */

function changeImage(id,src){

  document.getElementById(id).src = src;

}


function imageError(img){

  img.style.background="#222";

  img.style.objectFit="contain";

  img.alt="Image Not Found";

}


/* =====================================================
   SECTIONS
===================================================== */

function showSection(section){

  document.getElementById("glasses").classList.add("hidden");

  document.getElementById("chains").classList.add("hidden");

  document.getElementById("bracelets").classList.add("hidden");

  document.getElementById("promo").classList.add("hidden");

  document.getElementById("watches").classList.add("hidden");


  document.getElementById(section).classList.remove("hidden");


  document.getElementById("glassesBtn").classList.remove("active");

  document.getElementById("chainsBtn").classList.remove("active");

  document.getElementById("braceletsBtn").classList.remove("active");

  document.getElementById("promoBtn").classList.remove("active");

  document.getElementById("watchesBtn").classList.remove("active");


  if(section === "glasses"){

    document.getElementById("glassesBtn").classList.add("active");

  }


  if(section === "chains"){

    document.getElementById("chainsBtn").classList.add("active");

  }


  if(section === "bracelets"){

    document.getElementById("braceletsBtn").classList.add("active");

  }


  if(section === "promo"){

    document.getElementById("promoBtn").classList.add("active");

  }


  if(section === "watches"){

    document.getElementById("watchesBtn").classList.add("active");

  }

}
