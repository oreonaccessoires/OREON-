<title>ORION Accessories</title>

<style>
:root{
  --bg:#050505;
  --card:#111;
  --text:#fff;
  --gold:#e5b923;
  --border:#806515;
  --muted:#aaa;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

body.light{
  --bg:#f4f4f4;
  --card:#fff;
  --text:#111;
  --gold:#b88a00;
  --border:#c39b22;
  --muted:#555;
}

/* HEADER */

header{
  text-align:center;
  padding:30px 15px 20px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,5,5,.97);
  backdrop-filter:blur(10px);
}

.light header{
  background:rgba(255,255,255,.97);
}

.logo{
  font-size:40px;
  font-weight:bold;
  letter-spacing:7px;
  color:var(--gold);
}

.subtitle{
  margin-top:5px;
  letter-spacing:3px;
  color:#aaa;
  font-size:16px;
}

/* NAVIGATION */

.nav{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:25px;
}

.nav button,
.control button,
select{
  border:1px solid var(--gold);
  background:transparent;
  color:var(--text);
  border-radius:30px;
  padding:11px 20px;
  font-size:15px;
  cursor:pointer;
}

.nav button.active{
  background:var(--gold);
  color:#000;
  font-weight:bold;
}

.controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:18px;
  flex-wrap:wrap;
}

select{
  outline:none;
}

/* PRODUCTS */

.section-title{
  text-align:center;
  font-size:28px;
  color:var(--gold);
  margin:35px 0 20px;
}

.products{
  max-width:1200px;
  margin:auto;
  padding:0 15px 50px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.product{
  background:var(--card);
  border:1px solid #333;
  border-radius:22px;
  padding:12px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.main-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:16px;
  background:#222;
  display:block;
}

.product h2{
  font-size:18px;
  margin:15px 4px 8px;
}

.price{
  color:var(--gold);
  font-size:21px;
  font-weight:bold;
  margin:8px 4px 14px;
}

/* SMALL IMAGES / COLORS */

.thumbnails{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:5px 2px 10px;
}

.thumbnails img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid transparent;
  cursor:pointer;
  flex-shrink:0;
}

.thumbnails img:hover,
.thumbnails img.selected{
  border-color:var(--gold);
}

/* WHATSAPP */

.whatsapp{
  display:block;
  width:100%;
  padding:14px 8px;
  border:0;
  border-radius:13px;
  background:var(--gold);
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}

.whatsapp:hover{
  transform:scale(1.02);
}

/* EMPTY SECTIONS */

.empty{
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
  display:none;
}

.empty h2{
  color:var(--gold);
  margin-bottom:10px;
}

/* FOOTER */

footer{
  border-top:1px solid var(--border);
  text-align:center;
  padding:30px 15px;
}

.instagram{
  display:inline-block;
  margin-top:15px;
  color:var(--gold);
  text-decoration:none;
  border:1px solid var(--gold);
  padding:12px 22px;
  border-radius:25px;
}

/* DESKTOP */

@media(min-width:750px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }

  .product h2{
    font-size:17px;
  }
}
</style>
</head>

/* =========================
   IMAGE URL
========================= */

function imageURL(filename){

  return "images/" +
    filename
      .split("/")
      .map(part => encodeURIComponent(part))
      .join("/");

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(){

  const container =
    document.getElementById("glassesProducts");

  container.innerHTML = "";

  products.forEach(product => {

    const card = document.createElement("div");

    card.className = "product";

    const mainImage =
      imageURL(product.images[0]);

    card.innerHTML = `

      <img
        class="main-image"
        id="main-${product.id}"
        src="${mainImage}"
        alt="ORION Glasses Model ${product.id}"
        onerror="this.style.background='#222';"
      >

      <div class="thumbnails">

        ${product.images.map((img,index)=>`

          <img
            src="${imageURL(img)}"
            class="${index===0 ? 'selected':''}"
            onclick="changeImage(
              '${product.id}',
              '${imageURL(img)}',
              this
            )"
            alt="Color / View"
          >

        `).join("")}

      </div>

      <h2>
        ORION Glasses Model ${product.id}
      </h2>

      <div class="price">
        ${product.price} DH
      </div>

      <a
        class="whatsapp"
        href="${createWhatsAppLink(product)}"
        target="_blank">
        Commander WhatsApp
      </a>

    `;

    container.appendChild(card);

  });

}


/* =========================
   CHANGE MAIN IMAGE
========================= */

function changeImage(id,url,element){

  document.getElementById("main-"+id).src = url;

  const parent = element.parentElement;

  parent.querySelectorAll("img")
    .forEach(img => img.classList.remove("selected"));

  element.classList.add("selected");

}


/* =========================
   WHATSAPP ORDER
========================= */

function createWhatsAppLink(product){

  const message =
`Hello ORION Accessories 👋

I want to order:

🕶️ ORION Glasses Model ${product.id}
💰 Price: ${product.price} DH

Please confirm availability.

Thank you.`;

  return "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

}


/* =========================
   SECTIONS
========================= */

function showSection(section,button){

  document.getElementById("glasses").style.display="none";
  document.getElementById("chains").style.display="none";
  document.getElementById("watches").style.display="none";

  document.getElementById(section).style.display="block";

  document.querySelectorAll(".nav button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

}


/* =========================
   DARK / LIGHT
========================= */

function toggleTheme(){

  document.body.classList.toggle("light");

}


/* =========================
   LANGUAGE
========================= */

function changeLanguage(lang){

  if(lang === "ar"){

    document.documentElement.dir="rtl";

    document.querySelector(".subtitle").textContent =
      "إكسسوارات ORION";

  }

  else if(lang === "fr"){

    document.documentElement.dir="ltr";

    document.querySelector(".subtitle").textContent =
      "ACCESSOIRES";

  }

  else{

    document.documentElement.dir="ltr";

    document.querySelector(".subtitle").textContent =
      "ACCESSORIES";

  }

}
