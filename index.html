/* ORION upgrade add-on — include with <script src="./orion-upgrade.js"></script>
   right BEFORE </body> (after your main <script>). */
(function () {
  "use strict";

  /* ====== À MODIFIER : vos vraies informations ====== */
  var CONFIG = {
    deliveryTime: "24 à 72 h selon la ville",
    deliveryFee: "",            // ex: "30 DH" — vide = non affiché
    cashOnDelivery: true,       // paiement à la livraison
    returnPolicy: "Échange possible sous 48 h si le produit est défectueux ou si le modèle livré est différent de votre commande.",
    instagram: "",              // ex: "https://instagram.com/orion..."
    tiktok: "",
    facebook: ""
  };

  var DICT = {
    "Découvrir la collection": "اكتشف المجموعة",
    "Commander sur WhatsApp": "اطلب عبر واتساب",
    "Tout": "الكل", "Lunettes": "نظارات", "Colliers": "قلادات",
    "Bracelets": "أساور", "Promo": "عروض", "Montres": "ساعات",
    "Nos": "منتجاتنا من", "Pourquoi": "لماذا", "Comment": "كيف",
    "commander ?": "تطلب؟", "Avis de nos": "آراء", "clients": "زبنائنا",
    "Questions": "الأسئلة", "fréquentes": "الشائعة",
    "Lunettes, colliers et bracelets modernes. Un style premium accessible partout au Maroc.": "نظارات وقلادات وأساور عصرية. أناقة راقية في متناول الجميع في كل المغرب.",
    "Style Premium": "أناقة راقية", "Partout au Maroc": "في كل المغرب", "Commande Simple": "طلب بسيط",
    "Choisissez votre produit et votre modèle.": "اختر المنتج والموديل.",
    "Cliquez sur Commander via WhatsApp.": "اضغط على اطلب عبر واتساب.",
    "Confirmez vos informations et votre adresse.": "أكّد معلوماتك وعنوانك.",
    "Où livrez-vous ?": "أين تُوصلون؟", "Nous livrons partout au Maroc.": "نوصل لجميع مدن المغرب.",
    "Comment commander ?": "كيف أطلب؟",
    "Votre panier": "سلتك", "Livraison partout au Maroc": "توصيل لجميع أنحاء المغرب"
  };

  function t(fr, ar) { DICT[fr] = ar; return fr; }

  /* ---------- CSS ---------- */
  var css = document.createElement("style");
  css.textContent =
    ".ou-pay{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}" +
    "@media(max-width:900px){.ou-pay{grid-template-columns:1fr}}" +
    ".ou-social{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}" +
    ".ou-social a{border:1px solid var(--gold);border-radius:50px;padding:8px 16px;text-decoration:none;color:var(--gold)}" +
    ".ou-lang{font-size:13px;font-weight:bold}" +
    "[dir=rtl] .faq-question,[dir=rtl] .step{text-align:right}" +
    "[dir=rtl] .product,[dir=rtl] .cart-panel{direction:rtl}";
  document.head.appendChild(css);

  /* ---------- Delivery / payment / returns section ---------- */
  var cards = [
    ["🚚", t("Livraison", "التوصيل"),
      t("Livraison partout au Maroc en " + CONFIG.deliveryTime + ".", "التوصيل لكل المغرب خلال مدة تقريبية حسب المدينة.") +
      (CONFIG.deliveryFee ? " " + CONFIG.deliveryFee : "")],
    ["💵", t("Paiement", "الدفع"),
      CONFIG.cashOnDelivery
        ? t("Paiement à la livraison : vous payez à la réception de votre commande.", "الدفع عند الاستلام: تؤدي ثمن طلبك عند وصوله.")
        : t("Le paiement se confirme avec nous sur WhatsApp.", "يتم تأكيد الدفع معنا عبر واتساب.")],
    ["🔄", t("Échange", "الاستبدال"), t(CONFIG.returnPolicy, "الاستبدال متاح خلال 48 ساعة في حال وجود عيب أو اختلاف الموديل عن الطلب.")]
  ];

  var sec = document.createElement("section");
  sec.className = "section";
  sec.id = "livraison";
  sec.innerHTML =
    '<h2 class="section-title">' + t("Livraison, paiement & échange", "التوصيل والدفع والاستبدال") + "</h2>" +
    '<div class="ou-pay">' +
    cards.map(function (c) {
      return '<div class="info-card"><div class="icon">' + c[0] + "</div><h3>" + c[1] + "</h3><p>" + c[2] + "</p></div>";
    }).join("") + "</div>";

  var socials = [["Instagram", CONFIG.instagram], ["TikTok", CONFIG.tiktok], ["Facebook", CONFIG.facebook]]
    .filter(function (s) { return s[1]; });
  if (socials.length) {
    var box = document.createElement("div");
    box.className = "ou-social";
    box.innerHTML = socials.map(function (s) {
      return '<a href="' + s[1] + '" target="_blank" rel="noopener noreferrer">' + s[0] + "</a>";
    }).join("");
    sec.appendChild(box);
  }

  var firstFaq = document.querySelector(".faq-list");
  var faqSection = firstFaq ? firstFaq.closest(".section") : null;
  if (faqSection) faqSection.parentNode.insertBefore(sec, faqSection);
  else document.querySelector("main").appendChild(sec);

  /* ---------- Extra FAQ ---------- */
  var extra = [
    [t("Combien de temps dure la livraison ?", "كم تستغرق مدة التوصيل؟"), t("Généralement " + CONFIG.deliveryTime + ".", "عادة خلال مدة تقريبية حسب المدينة.")],
    [t("Puis-je payer à la livraison ?", "هل يمكن الدفع عند الاستلام؟"),
      CONFIG.cashOnDelivery ? t("Oui, vous payez à la réception.", "نعم، تدفع عند الاستلام.") : t("Le paiement est confirmé avec nous sur WhatsApp.", "يتم تأكيد الدفع معنا عبر واتساب.")],
    [t("Puis-je échanger un produit ?", "هل يمكنني استبدال منتج؟"), t(CONFIG.returnPolicy, "الاستبدال متاح خلال 48 ساعة في حال وجود عيب أو اختلاف الموديل عن الطلب.")]
  ];
  if (firstFaq) {
    extra.forEach(function (q) {
      var d = document.createElement("div");
      d.className = "faq-item";
      d.innerHTML = '<button class="faq-question" onclick="toggleFaq(this)">' + q[0] + "<span>+</span></button>" +
        '<div class="faq-answer">' + q[1] + "</div>";
      firstFaq.appendChild(d);
    });
  }

  /* ---------- Search: hide empty sections ---------- */
  var origSearch = window.searchProducts;
  if (typeof origSearch === "function") {
    window.searchProducts = function () {
      origSearch();
      var q = (document.getElementById("searchInput").value || "").trim();
      ["glasses", "chains", "bracelets", "promo"].forEach(function (id) {
        var s = document.getElementById(id);
        if (!s) return;
        var any = Array.prototype.some.call(s.querySelectorAll(".product"), function (p) { return p.style.display !== "none"; });
        s.classList.toggle("hidden", !!q && !any);
      });
    };
  }

  /* ---------- Product structured data (SEO) ---------- */
  try {
    var groups = [
      ["Lunettes ORION Model ", typeof glasses !== "undefined" ? glasses : []],
      ["Collier ORION Model ", typeof chains !== "undefined" ? chains : []],
      ["Bracelet ORION Model ", typeof bracelets !== "undefined" ? bracelets : []]
    ];
    var items = [];
    groups.forEach(function (g) {
      g[1].forEach(function (p) {
        items.push({
          "@type": "Product",
          name: g[0] + p.model,
          image: p.images.slice(0, 3).map(function (im) { return new URL(encodeURI(im), location.href).href; }),
          brand: { "@type": "Brand", name: "ORION Accessories" },
          offers: { "@type": "Offer", priceCurrency: "MAD", price: String(p.price), availability: "https://schema.org/InStock", url: location.href }
        });
      });
    });
    var ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@graph": items });
    document.head.appendChild(ld);
  } catch (e) { console.warn("ORION JSON-LD", e); }

  /* ---------- FR / AR toggle ---------- */
  var originals = new WeakMap();
  function walk(lang) {
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentNode;
        if (!p || /^(SCRIPT|STYLE|NOSCRIPT)$/.test(p.nodeName)) return NodeFilter.FILTER_REJECT;
        if (p.closest && p.closest(".product,.cart-item,.ou-lang")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var n;
    while ((n = w.nextNode())) {
      if (!originals.has(n)) originals.set(n, n.nodeValue);
      var src = originals.get(n);
      var key = src.trim().replace(/\s+/g, " ");
      if (lang === "ar" && DICT[key]) n.nodeValue = src.replace(key, DICT[key]);
      else if (lang === "fr") n.nodeValue = src;
    }
  }
  function setLang(lang) {
    document.documentElement.lang = lang === "ar" ? "ar-MA" : "fr-MA";
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    walk(lang);
    btn.textContent = lang === "ar" ? "FR" : "عربي";
    try { localStorage.setItem("orionLang", lang); } catch (e) {}
  }
  var btn = document.createElement("button");
  btn.className = "tool ou-lang";
  btn.type = "button";
  btn.setAttribute("aria-label", "Changer la langue / تغيير اللغة");
  btn.onclick = function () { setLang(document.documentElement.dir === "rtl" ? "fr" : "ar"); };
  var tools = document.querySelector(".tools");
  if (tools) tools.appendChild(btn);
  var saved = "fr";
  try { saved = localStorage.getItem("orionLang") || "fr"; } catch (e) {}
  btn.textContent = "عربي";
  if (saved === "ar") setLang("ar");
})();
