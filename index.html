<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORION Accessories | Sunglasses</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0b0b0b;
    color:white;
}

header{
    background:#050505;
    border-bottom:1px solid #c9a227;
    padding:20px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:3px;
    color:#d4af37;
}

.subtitle{
    color:#aaa;
    margin-top:6px;
    font-size:13px;
}

.hero{
    text-align:center;
    padding:45px 20px 30px;
}

.hero h1{
    color:#d4af37;
    font-size:34px;
    margin-bottom:12px;
}

.hero p{
    color:#bbb;
}

.products{
    width:94%;
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:18px;
    padding-bottom:50px;
}

.card{
    background:#141414;
    border:1px solid #272727;
    border-radius:15px;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#d4af37;
}

.product-img{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#222;
}

.info{
    padding:15px;
}

.info h2{
    font-size:17px;
    margin-bottom:8px;
}

.price{
    color:#d4af37;
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

.btn{
    display:block;
    width:100%;
    padding:11px;
    background:#d4af37;
    color:#000;
    text-decoration:none;
    text-align:center;
    font-weight:bold;
    border-radius:8px;
}

.btn:hover{
    background:#f0cf55;
}

footer{
    border-top:1px solid #272727;
    text-align:center;
    padding:30px 15px;
    color:#888;
}

.social{
    margin-top:12px;
}

.social a{
    color:#d4af37;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <div class="logo">ORION</div>
    <div class="subtitle">ACCESSORIES</div>
</header>

<section class="hero">
    <h1>ORION SUNGLASSES</h1>
    <p>Découvrez notre collection exclusive</p>
</section>

<section class="products" id="products"></section>

<footer>
    <strong>ORION Accessories</strong>
    <div class="social">
        Instagram:
        <a href="https://www.instagram.com/orion___accessories_official/" target="_blank">
            @orion___accessories_official
        </a>
    </div>
    <p style="margin-top:12px;">© 2026 ORION Accessories</p>
</footer>

<script>

const WHATSAPP = "212XXXXXXXXX";

/*
    19 MODELES
    Model 01 → 06 : 120 DH
    Model 07 : 140 DH
    Model 08 : 130 DH
    Model 09 → 10 : 120 DH

    Model 11 → 19 :
    غادي نبدلو الثمن والصور ملي ترفعهم.
*/

const products = [

{
    name:"ORION Glasses Model 01",
    price:120,
    image:"ORION Glasses Model 01 gold 120dh.JPG"
},

{
    name:"ORION Glasses Model 02",
    price:120,
    image:"ORION Glasses Model 02 120dh 1.JPG"
},

{
    name:"ORION Glasses Model 03",
    price:120,
    image:"ORION Glasses Model 03 120dh 1.JPG"
},

{
    name:"ORION Glasses Model 04",
    price:120,
    image:"ORION Glasses Model 04 120dh 1.JPG"
},

{
    name:"ORION Glasses Model 05",
    price:120,
    image:"ORION Glasses Model 05 120dh 1.JPG"
},

{
    name:"ORION Glasses Model 06",
    price:120,
    image:"ORION Glasses Model 06 120dh 1.JPG"
},

{
    name:"ORION Glasses Model 07",
    price:140,
    image:"ORION Glasses Model 07 140dh 1.JPG"
},

{
    name:"ORION Glasses Model 08",
    price:130,
    image:"ORION Glasses Model 08 130dh 1.JPG"
},

{
    name:"ORION Glasses Model 09",
    price:120,
    image:"ORION Glasses Model 09 120dh 1.JPG"
},

{
    name:"ORION Glasses Model 10",
    price:120,
    image:"ORION Glasses Model 10 120dh 1.JPG"
},

/* MODELES 11 → 19 */

{
    name:"ORION Glasses Model 11",

},

{

{

},

{
    name:"ORION Glasses Model 15",

},

{

{

];

const container = document.getElementById("products");

products.forEach((product,index)=>{

    const message =
        `سلام، بغيت نطلب ${product.name} بثمن ${product.price} DH`;

    const whatsapp =
        `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;

    container.innerHTML += `

    <div class="card">

        <img
            class="product-img"
            src="${product.image}"
            alt="${product.name}"
            onerror="this.src='https://via.placeholder.com/500x600/111111/D4AF37?text=ORION'"
        >

        <div class="info">

            <h2>${product.name}</h2>

            <div class="price">
                ${product.price} DH
            </div>

            <a
                class="btn"
                href="${whatsapp}"
                target="_blank"
            >
                Commander WhatsApp
            </a>

        </div>

    </div>

    `;

});

</script>

</body>
</html>
