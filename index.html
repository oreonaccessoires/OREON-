<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORION Accessories</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
}

header {
    text-align: center;
    padding: 35px 15px 25px;
    border-bottom: 1px solid #c9a227;
}

.logo {
    color: #d4af37;
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 9px;
}

.subtitle {
    color: #aaa;
    font-size: 20px;
    letter-spacing: 5px;
    margin-top: 8px;
}

.nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
}

.nav button,
.lang {
    background: transparent;
    color: white;
    border: 1px solid #d4af37;
    border-radius: 30px;
    padding: 13px 25px;
    font-size: 17px;
    cursor: pointer;
}

.nav button.active {
    background: #d4af37;
    color: #000;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
}

select {
    background: #111;
    color: white;
    border: 1px solid #d4af37;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 16px;
}

h1 {
    text-align: center;
    color: #d4af37;
    margin: 35px 0 25px;
}

.products {
    width: 95%;
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding-bottom: 50px;
}

.card {
    background: #151515;
    border: 1px solid #444;
    border-radius: 20px;
    padding: 15px;
    overflow: hidden;
}

.main-image {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 15px;
    background: #222;
    display: block;
}

.thumbs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 10px;
}

.thumb {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #555;
    cursor: pointer;
    flex-shrink: 0;
}

.thumb:hover {
    border: 2px solid #d4af37;
}

.name {
    font-size: 20px;
    font-weight: bold;
    margin-top: 18px;
}

.price {
    color: #d4af37;
    font-size: 23px;
    font-weight: bold;
    margin: 15px 0;
}

.whatsapp {
    display: block;
    text-align: center;
    background: #d4af37;
    color: #000;
    text-decoration: none;
    padding: 16px;
    border-radius: 14px;
    font-weight: bold;
    font-size: 17px;
}

@media (max-width: 600px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .card {
        padding: 10px;
    }

    .main-image {
        height: 210px;
    }

    .name {
        font-size: 17px;
    }

    .price {
        font-size: 20px;
    }

    .whatsapp {
        font-size: 14px;
        padding: 13px 5px;
    }

    .logo {
        font-size: 34px;
    }
}
</style>
</head>

    const card = document.createElement("div");
    card.className = "card";

    const mainImage = document.createElement("img");
    mainImage.className = "main-image";

    mainImage.src = "images/" + encodeURIComponent(product.images[0]);

    mainImage.onerror = function() {
        this.src = "https://placehold.co/600x600/222/fff?text=Image+Not+Found";
    };

    card.appendChild(mainImage);

    const thumbs = document.createElement("div");
    thumbs.className = "thumbs";

    product.images.forEach((image) => {

        const thumb = document.createElement("img");
        thumb.className = "thumb";

        thumb.src = "images/" + encodeURIComponent(image);

        thumb.onerror = function() {
            this.style.display = "none";
        };

        thumb.onclick = () => {
            mainImage.src = "images/" + encodeURIComponent(image);
        };

        thumbs.appendChild(thumb);
    });

    card.appendChild(thumbs);

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = product.name;

    card.appendChild(name);

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = product.price + " DH";
