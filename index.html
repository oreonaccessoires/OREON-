<title>ORION Accessories</title>

<style>
:root{
  --bg:#080808;
  --card:#151515;
  --text:#fff;
  --muted:#aaa;
  --gold:#d9ad27;
  --border:#3b3b3b;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

body.light{
  --bg:#f5f5f5;
  --card:#fff;
  --text:#111;
  --muted:#555;
  --border:#ddd;
}

/* HEADER */
header{
  text-align:center;
  padding:28px 15px 20px;
  border-bottom:1px solid var(--gold);
  position:sticky;
  top:0;
  z-index:1000;
  background:var(--bg);
}

.logo{
  color:var(--gold);
  font-size:38px;
  font-weight:900;
  letter-spacing:5px;
}

.subtitle{
  color:var(--muted);
  font-size:15px;
  margin-top:5px;
  letter-spacing:2px;
}

/* NAV */
nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  padding:15px 10px;
}

nav button{
  border:1px solid var(--gold);
  background:transparent;
  color:var(--text);
  padding:9px 13px;
  border-radius:20px;
  cursor:pointer;
}

nav button:hover{
  background:var(--gold);
  color:#000;
}

/* TOOLS */
.tools{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:5px 0 15px;
}

.tools button,
.tools select{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--gold);
  border-radius:10px;
  padding:9px 12px;
}

/* SECTION */
section{
  max-width:1200px;
  margin:auto;
  padding:25px 15px;
}

.section-title{
  text-align:center;
  color:var(--gold);
  font-size:28px;
  margin-bottom:25px;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:12px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.main-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:15px;
  background:#222;
  display:block;
}

.thumbnails{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:9px 0 5px;
}

.thumbnails img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid transparent;
  cursor:pointer;
  flex-shrink:0;
}

.thumbnails img:hover,
.thumbnails img.active{
  border-color:var(--gold);
}

.product h3{
  font-size:18px;
  margin:10px 0 7px;
}

.price{
  color:var(--gold);
  font-weight:bold;
  font-size:21px;
  margin-bottom:12px;
}

.whatsapp{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  background:var(--gold);
  color:#000;
  font-weight:bold;
  padding:13px 8px;
  border-radius:12px;
  font-size:16px;
}

.whatsapp:hover{
  opacity:.85;
}

/* FOOTER */
footer{
  text-align:center;
  border-top:1px solid var(--border);
  padding:30px 15px;
  margin-top:30px;
}

.instagram{
  display:inline-block;
  color:var(--gold);
  text-decoration:none;
  margin-top:12px;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:650px){
  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product{
    padding:8px;
    border-radius:15px;
  }

  .product h3{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

  .whatsapp{
    font-size:13px;
    padding:11px 4px;
  }

  .thumbnails img{
    width:48px;
    height:48px;
  }

  .logo{
    font-size:30px;
  }
}

@media(max-width:380px){
  .products{
    grid-template-columns:1fr;
  }
}
</style>
</head>

/* =========================
   CREATE PRODUCT
========================= */

function createProduct(product, type){

  const images = product.images || [];

  if(images.length === 0) return "";

  const title =
    product.model
    ? `ORION Glasses Model ${product.model}`
    : product.name;

  const firstImage = images[0];

  let thumbnails = "";

  images.forEach((image,index)=>{

    thumbnails += `
      <img
        src="${image}"
        class="${index===0 ? 'active':''}"
        onclick="changeImage(this,'main-${type}-${product.model || product.name.replace(/\s/g,'')}')"
        onerror="this.style.display='none'">
    `;

  });


  const message =
    `Salam, bghit nطلب ${title} - ${product.price} DH`;

  const whatsapp =
    `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;


  return `

  <article class="product">

    <img
      id="main-${type}-${product.model || product.name.replace(/\s/g,'')}"
      class="main-image"
      src="${firstImage}"
      alt="${title}"
      onerror="this.src='https://via.placeholder.com/600x600/151515/D9AD27?text=ORION+Accessories'">

    <div class="thumbnails">
      ${thumbnails}
    </div>

    <h3>${title}</h3>

    <div class="price">
      ${product.price} DH
    </div>

    <a
      class="whatsapp"
      href="${whatsapp}"
      target="_blank">
      Commander WhatsApp
    </a>

  </article>

  `;

}

/* =========================
   CHANGE MAIN IMAGE
========================= */

function changeImage(thumb,id){

  const main = document.getElementById(id);

  if(main){
    main.src = thumb.src;
  }

  const parent = thumb.parentElement;

  parent.querySelectorAll("img").forEach(img=>{
    img.classList.remove("active");
  });

  thumb.classList.add("active");
}


/* =========================
   DARK MODE
========================= */

function toggleDark(){

  document.body.classList.toggle("light");

  localStorage.setItem(
    "orionTheme",
    document.body.classList.contains("light")
      ? "light"
      : "dark"
  );

}

if(localStorage.getItem("orionTheme")==="light"){
  document.body.classList.add("light");
}


/* =========================
   SHOW SECTION
========================= */

function showSection(id){

  document.getElementById(id)
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================
   LANGUAGE
========================= */

function changeLanguage(lang){

  document.querySelectorAll("[data-en]").forEach(el=>{

    if(lang==="en"){
      el.textContent=el.dataset.en;
    }

    if(lang==="fr"){
      el.textContent=el.dataset.fr;
    }

    if(lang==="ar"){
      el.textContent=el.dataset.ar;
    }

  });

  document.documentElement.lang=lang;

  if(lang==="ar"){
    document.body.dir="rtl";
  }else{
    document.body.dir="ltr";
  }

}
