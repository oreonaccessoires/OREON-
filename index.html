<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORION Accessories</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#050505;
    color:white;
}

header{
    text-align:center;
    padding:45px 15px 30px;
    border-bottom:1px solid #c9a227;
}

.logo{
    font-size:48px;
    letter-spacing:9px;
    color:#d4af37;
    font-weight:bold;
}

.subtitle{
    font-size:20px;
    letter-spacing:6px;
    color:#aaa;
    margin-top:8px;
}

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:35px;
}

nav button{
    border:1px solid #d4af37;
    background:#080808;
    color:white;
    padding:15px 25px;
    border-radius:30px;
    font-size:17px;
    cursor:pointer;
}

nav button.active,
nav button:hover{
    background:#d4af37;
    color:#000;
}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:25px;
}

select,
.theme{
    border:1px solid #d4af37;
    background:#080808;
    color:white;
    padding:12px 20px;
    border-radius:20px;
    font-size:16px;
}

main{
    max-width:1200px;
    margin:auto;
    padding:35px 18px;
}

h1{
    text-align:center;
    color:#d4af37;
    margin-bottom:30px;
    font-size:38px;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.card{
    background:#151515;
    border:1px solid #333;
    border-radius:25px;
    padding:18px;
    overflow:hidden;
}

.main-image{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:18px;
    background:#222;
    display:block;
}

.thumbs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-top:10px;
    padding-bottom:5px;
}

.thumb{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid #555;
    cursor:pointer;
    flex-shrink:0;
}

.thumb:hover{
    border:2px solid #d4af37;
}

.card h2{
    font-size:21px;
    margin-top:18px;
}

.price{
    color:#d4af37;
    font-size:25px;
    font-weight:bold;
    margin:12px 0 18px;
}

.whatsapp{
    width:100%;
    border:0;
    background:#d4af37;
    color:#000;
    padding:16px;
    border-radius:15px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.whatsapp:hover{
    background:#f0cc55;
}

footer{
    text-align:center;
    padding:35px;
    color:#888;
    border-top:1px solid #333;
    margin-top:30px;
}

@media(max-width:600px){
    .logo{
        font-size:38px;
    }

    .subtitle{
        font-size:15px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .card{
        padding:10px;
        border-radius:18px;
    }

    .card h2{
        font-size:17px;
    }

    .price{
        font-size:20px;
    }

    .whatsapp{
        font-size:14px;
        padding:13px 5px;
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<button class="active" onclick="showCategory('glasses')">🕶️ Glasses</button>

<button onclick="showCategory('watches')">⌚ Watches</button>
</nav>

<div class="controls">
<button class="theme" onclick="toggleTheme()">🌙 / ☀️</button>

<select id="language">
<option value="en">English</option>
<option value="fr">Français</option>
<option value="ar">العربية</option>

/* =========================

function showCategory(category){

if(category === "glasses"){

document.getElementById("title").textContent="ORION Glasses";

renderGlasses();

}

else if(category === "chains"){

document.getElementById("title").textContent="ORION Chains";

document.getElementById("products").innerHTML=`
<div style="grid-column:1/-1;text-align:center;padding:60px;color:#d4af37;font-size:22px;">
⛓️ Chains coming soon
</div>
`;

}

else if(category === "watches"){

document.getElementById("title").textContent="ORION Watches";

document.getElementById("products").innerHTML=`
<div style="grid-column:1/-1;text-align:center;padding:60px;color:#d4af37;font-size:22px;">
⌚ Watches coming soon
</div>
`;

}


function renderGlasses(){

const container=document.getElementById("products");

container.innerHTML="";

glasses.forEach((product,index)=>{

const card=document.createElement("div");

card.className="card";

let imageHTML="";

product.images.forEach((image,i)=>{

imageHTML += `
<img
class="thumb"
src="${image}"
alt="ORION Glasses Model ${product.model}"
onclick="changeImage(${index},${i})"
onerror="this.style.display='none'"
>
`;

});

card.innerHTML=`

<img
id="main-${index}"
class="main-image"
src="${product.images[0]}"
alt="ORION Glasses Model ${product.model}"
onerror="this.onerror=null;this.src='';this.alt='Image not found';"
>

<div class="thumbs">
${imageHTML}
</div>

<h2>ORION Glasses Model ${product.model}</h2>

<div class="price">${product.price} DH</div>

<button
class="whatsapp"
onclick="orderProduct('${product.model}',${product.price})">
Commander WhatsApp
</button>

`;

container.appendChild(card);

});

}


function changeImage(productIndex,imageIndex){

document.getElementById(`main-${productIndex}`).src =
glasses[productIndex].images[imageIndex];

}


function orderProduct(model,price){

const message =
`Bonjour ORION Accessories 👋

Je veux commander :

🕶️ ORION Glasses Model ${model}
💰 Prix : ${price} DH

Merci.`;

const url =
"https://wa.me/" +
WHATSAPP_NUMBER +
"?text=" +
encodeURIComponent(message);

window.open(url,"_blank");

}


function toggleTheme(){

document.body.classList.toggle("light");

if(document.body.classList.contains("light")){

document.body.style.background="#f5f5f5";
document.body.style.color="#111";

document.querySelectorAll(".card").forEach(card=>{
card.style.background="#fff";
card.style.color="#111";
});

}else{

document.body.style.background="#050505";
document.body.style.color="white";

document.querySelectorAll(".card").forEach(card=>{
card.style.background="#151515";
card.style.color="white";
});

}

}
