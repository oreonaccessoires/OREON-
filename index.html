<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ORION Accessories | Lunettes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
    }

    header {
      background: #080808;
      border-bottom: 1px solid #b8953d;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #d4af37;
    }

    .subtitle {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
      letter-spacing: 2px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px 30px;
    }

    .hero h1 {
      color: #d4af37;
      font-size: 34px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #ccc;
      font-size: 15px;
    }

    .products {
      width: 94%;
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      padding-bottom: 50px;
    }

    .product {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      overflow: hidden;
      transition: 0.3s;
    }

    .product:hover {
      border-color: #d4af37;
      transform: translateY(-3px);
    }

    .product img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #181818;
    }

    .info {
      padding: 14px;
      text-align: center;
    }

    .info h2 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .price {
      color: #d4af37;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .order {
      display: block;
      background: #d4af37;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      padding: 11px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .order:hover {
      background: #f0cf65;
    }

    footer {
      border-top: 1px solid #292929;
      text-align: center;
      padding: 25px 15px;
      color: #888;
      font-size: 13px;
    }

    footer strong {
      color: #d4af37;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }

      .hero h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ORION</div>
  <div class="subtitle">ACCESSORIES</div>
</header>

<section class="hero">
  <h1>ORION GLASSES</h1>
  <p>Découvrez notre collection de lunettes élégantes.</p>
</section>

<section class="products" id="products"></section>

<footer>
  <p><strong>ORION Accessories</strong></p>
  <p>Qualité • Style • Élégance</p>
  <p>© 2026 ORION Accessories</p>
</footer>

<script>

  /* ==============================
     رقم WhatsApp ديالك
     مثال المغرب:
     212612345678
     ============================== */

  const whatsapp = "212XXXXXXXXX";


  /* ==============================
     المنتجات
     ============================== */

  const products = [

    {
      model: "Model 11",
      price: 120,
      images: [
        "ORION Glasses Model 11 120dh 1.JPG",
        "ORION Glasses Model 11 120dh 2.JPG",
        "ORION Glasses Model 11 120dh 3.JPG",
        "ORION Glasses Model 11 120dh 4.JPG",
        "ORION Glasses Model 11 120dh 5.JPG"
      ]
    },

    {
      model: "Model 12",
      price: 120,
      images: [
        "ORION Glasses Model 12 120dh 1.JPG",
        "ORION Glasses Model 12 120dh 2.JPG",
        "ORION Glasses Model 12 120dh 3.JPG",
        "ORION Glasses Model 12 120dh 4.JPG",
        "ORION Glasses Model 12 120dh 5.JPG",
        "ORION Glasses Model 12 120dh 6.JPG",
        "ORION Glasses Model 12 120dh 7.JPG",
        "ORION Glasses Model 12 120dh 8.JPG",
        "ORION Glasses Model 12 120dh 10.JPG"
      ]
    },

    {
      model: "Model 13",
      price: 120,
      images: [
        "ORION Glasses Model 13 120dh 1.JPG",
        "ORION Glasses Model 13 120dh 2.JPG",
        "ORION Glasses Model 13 120dh 3.JPG",
        "ORION Glasses Model 13 120dh 4.JPG",
        "ORION Glasses Model 13 120dh 5.JPG"
      ]
    },

    {
      model: "Model 14",
      price: 120,
      images: [
        "ORION Glasses Model 14 120dh 1.JPG",
        "ORION Glasses Model 14 120dh 2.JPG",
        "ORION Glasses Model 14 120dh 3.JPG"
      ]
    },

    {
      model: "Model 15",
      price: 120,
      images: [
        "ORION Glasses Model 15 120dh 1.JPG",
        "ORION Glasses Model 15 120dh 2.JPG"
      ]
    },

    {
      model: "Model 16",
      price: 140,
      images: [
        "ORION Glasses Model 16 140dh 1.JPG"
      ]
    },

    {
      model: "Model 17",
      price: 140,
      images: [
        "ORION Glasses Model 17 140dh 1.JPG"
      ]
    },

    {
      model: "Model 18",
      price: 120,
      images: [
        "ORION Glasses Model 18 120dh 1.JPG",
        "ORION Glasses Model 18 120dh 2.JPG",
        "ORION Glasses Model 18 120dh 3.JPG"
      ]
    },

    {
      model: "Model 19",
      price: 130,
      images: [
        "ORION Glasses Model 19 130dh 1.JPG",
        "ORION Glasses Model 19 130dh 2.JPG",
        "ORION Glasses Model 19 130dh 3.JPG",
        "ORION Glasses Model 19 130dh 4.JPG"
      ]
    }

  ];


  /* ==============================
     إنشاء المنتجات
     ============================== */

  const container = document.getElementById("products");

  products.forEach(product => {

    const card = document.createElement("div");
    card.className = "product";

    const image = document.createElement("img");

    /*
      أول صورة هي اللي غادي تبان.
      الضغط عليها يبدل بين الصور.
    */

    let currentImage = 0;

    image.src = encodeURI(product.images[currentImage]);
    image.alt = "ORION " + product.model;

    image.addEventListener("click", () => {

      if (product.images.length > 1) {

        currentImage++;

        if (currentImage >= product.images.length) {
          currentImage = 0;
        }

        image.src = encodeURI(product.images[currentImage]);

      }

    });


    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("h2");
    title.textContent = "ORION " + product.model;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = product.price + " DH";


    const button = document.createElement("a");
    button.className = "order";
    button.textContent = "Commander sur WhatsApp";

    const message =
      "Bonjour ORION Accessories 👋%0A%0A" +
      "Je souhaite commander : " +
      product.model +
      "%0A" +
      "Prix : " +
      product.price +
      " DH";

    button.href = "https://wa.me/" + whatsapp + "?text=" + message;
    button.target = "_blank";


    info.appendChild(title);
    info.appendChild(price);
    info.appendChild(button);

    card.appendChild(image);
    card.appendChild(info);

    container.appendChild(card);

  });

</script>

</body>
</html>
